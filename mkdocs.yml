site_name: UnisonOS
site_description: A private personal assistant designed to work for you on your own trusted device.
site_url: https://project-unisonos.github.io

docs_dir: docs
theme:
  name: mkdocs
  custom_dir: overrides

nav:
  - Home: index.md
  - Product:
      - Vision: vision.md
      - How It Works: how-unison-works.md
      - Personal Node: personal-node.md
      - Context Spaces: household-context-spaces.md
      - Remote Assistant: remote-assistant.md
  - Experience:
      - Experience Principles: experience.md
      - Multimodal Interaction: experience/multimodal.md
      - AI Personality: experience/ai-personality.md
      - System Capabilities: experience/system-capabilities.md
      - Accessibility: accessibility.md
      - Modalities and Ecosystem: ecosystem.md
  - Trust:
      - Privacy & Security: privacy-security.md
      - Backup & Recovery: backup-recovery.md
      - Assistant Workflows: assistant-workflows.md
      - Trust Decisions: trust-decisions.md
  - Developers:
      - Architecture:
          - Overview: architecture/overview.md
          - Deep Dive: architecture/deep-dive.md
      - Get Started:
          - Install UnisonOS: developers/install-unisonos.md
          - Appliance Release Lifecycle: developers/appliance-release-lifecycle.md
          - Archived WSL2 Channel: developers/install-wsl2.md
          - Archived Linux VM Channel: developers/install-linux-vm.md
          - Archived Bare Metal Channel: developers/install-bare-metal.md
          - Install Options: developers/install-options.md
          - Prerequisites: developers/prerequisites.md
          - Onboarding: developers/onboarding.md
      - Build & Operate:
          - Workspace & Repos: developers/workspace-and-repos.md
          - Devstack Setup: developers/devstack.md
          - Renderer: developers/renderer.md
          - Testing: developers/testing.md
          - Build & Deploy: developers/workflow-design.md
          - Images & Releases: developers/images-builds-and-releases.md
          - Releases: developers/releases.md
          - Contributing: developers/contributing.md
      - Reference:
          - Specs & Schemas: reference/specs.md
          - APIs: reference/apis.md
          - Security: reference/security.md
          - Compatibility: reference/compatibility.md
  - Project:
      - Current Status: current-status.md
      - Terminology: terminology.md
      - Governance: project/governance.md
      - Roadmap: project/roadmap.md
      - License: project/license.md

plugins:
  - search
  - redirects:
      redirect_maps:
        developers/evaluate-alpha.md: developers/releases.md
        developers/renderer-and-shell.md: developers/renderer.md

markdown_extensions:
  - toc:
      permalink: true
  - attr_list
  - admonition
  - def_list
  - footnotes

extra_css:
  - assets/design-tokens.css
  - assets/nav-contrast.css
  - assets/a11y.css

extra_javascript:
  - assets/a11y.js
